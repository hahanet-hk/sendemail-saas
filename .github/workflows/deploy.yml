name: Deploy sendemail-saas

on:
  push:
    branches: [main]

concurrency:
  group: deploy-sendemail-saas
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out sendemail-saas
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install api dependencies
        working-directory: api
        run: npm ci

      - name: Run api tests
        working-directory: api
        run: npm test

      - name: Run worker tests
        working-directory: worker
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Update sendemail-saas on the VPS and rebuild
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" 'bash -s' << 'REMOTE'
          set -euo pipefail
          export GIT_SSH_COMMAND='ssh -i /root/.ssh/sendemail-ai-pull -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
          cd /home/docker-apps/sendemail-saas
          git -c safe.directory=/home/docker-apps/sendemail-saas pull --ff-only origin main
          docker compose up -d --build sendemail-web sendemail-api sendemail-worker
          echo DEPLOYED
          REMOTE
